name: Update pricing data

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Scheduled runs use the repo default branch; manual runs must target main.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r scraper/requirements.txt

      - name: Run full pricing pipeline
        id: scrape
        run: python scraper/scrape.py

      - name: Validate and ensure embed sync
        run: python scraper/validate.py --check-embed

      - name: Upload scraped data for deploy
        uses: actions/upload-artifact@v6
        with:
          name: scraped-data
          path: data/

      - name: Commit and push if pricing meaningfully changed
        if: steps.scrape.outputs.pricing_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pricing.json data/pricing.embed.js data/model-inventory.snapshot.json
          if git diff --staged --quiet; then
            echo "No staged changes; skipping push."
            exit 0
          fi
          git commit -m "data: update Bedrock catalog and pricing [skip ci]"
          git push

  deploy:
    needs: scrape
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages-reusable.yml
    with:
      data_artifact: scraped-data
    secrets: inherit
